name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Sample data builds through the real pipeline
        run: |
          python tools/make_sample_data.py
          python -c "import json; d=json.load(open('web/data/index.json')); assert d['quotes'] and d['schema']==2, 'bad index'; print(len(d['quotes']),'quotes')"
      - name: symbols.json is valid
        run: python -c "from pipeline.quotes import load_symbols; s=load_symbols('symbols.json'); print(len(s),'symbols'); assert any(x.symbol=='^TWII' for x in s)"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test "web/tests/*.test.mjs"
      - name: Every module imported by main.js exists
        run: node web/tests/check-imports.mjs
